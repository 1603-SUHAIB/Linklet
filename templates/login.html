<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="__CSRF_TOKEN_PLACEHOLDER__">
    <title>Login /// SECURE_NODE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #00bfff;
            --dark-bg: #111827;
            --card-bg: #1f2937;
            --border-color: rgba(59, 130, 246, 0.2);
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
        }

        body {
            font-family: 'Chakra Petch', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-primary);
            overflow-x: hidden;
            background-image: 
                linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
            background-size: 35px 35px;
            animation: moveGrid 60s linear infinite;
        }
        
        @keyframes moveGrid {
            from { background-position: 0 0; }
            to { background-position: -35px -35px; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes flicker {
            0%, 100% { opacity: 1; text-shadow: 0 0 8px rgba(59, 130, 246, 0.5); }
            50% { opacity: 0.9; text-shadow: 0 0 10px rgba(59, 130, 246, 0.3); }
        }

        .pro-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            animation: fadeIn 0.5s ease-out;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.1);
        }

        .pro-input {
            background-color: #374151; /* gray-700 */
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            caret-color: var(--primary-blue);
            transition: all 0.3s;
            border-radius: 0.375rem;
        }
        .pro-input:focus {
            outline: none;
            box-shadow: 0 0 0 2px var(--dark-bg), 0 0 0 4px var(--primary-blue);
            border-color: var(--primary-blue);
        }

        .pro-btn {
            background-color: var(--primary-blue);
            color: white;
            transition: all 0.2s ease-in-out;
            border-radius: 0.375rem;
            font-weight: 600;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }
        .pro-btn:hover {
            filter: brightness(1.2);
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.5);
        }
        .pro-btn-secondary {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
        }
        .pro-btn-secondary:hover {
             background-color: #374151;
             border-color: var(--primary-blue);
        }

        .section-title {
            animation: flicker 4s infinite alternate;
        }
    </style>
</head>
<body>
    <div class="min-h-screen flex flex-col items-center justify-center p-4">
        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="w-full absolute top-0 left-0 z-50 p-4">
                {% for category, message in messages %}
                <div id="flash-message" class="pro-card max-w-md mx-auto p-4 flex justify-between items-center {% if category == 'error' %} bg-red-500/20 border-red-500/30 text-red-300 {% else %} bg-green-500/20 border-green-500/30 text-green-300 {% endif %}">
                    <span>{{ message }}</span>
                    <button onclick="this.parentElement.style.display='none'">&times;</button>
                </div>
                {% endfor %}
            </div>
            {% endif %}
        {% endwith %}

        <main class="w-full max-w-md">
            <div class="pro-card p-8 space-y-6">
                <div class="text-center">
                    <a href="{{ url_for('home') }}" class="text-3xl font-bold tracking-wider text-blue-400 hover:text-blue-300 transition">🔗 LINKLET</a>
                    <h2 id="form-title" class="mt-6 text-2xl font-bold tracking-tight text-text-primary section-title uppercase">Secure Access</h2>
                    <p id="form-subtitle" class="mt-2 text-sm text-text-secondary">Please complete the steps below</p>
                </div>

                <div id="error-message" class="hidden bg-red-500/20 border border-red-500/30 text-red-300 px-4 py-3 rounded-lg text-sm" role="alert">
                    <span id="error-text"></span>
                </div>
                <div id="success-message" class="hidden bg-green-500/20 border border-green-500/30 text-green-300 px-4 py-3 rounded-lg text-sm" role="alert">
                    <span id="success-text"></span>
                </div>

                <div id="email-form" class="fade-in">
                    <form class="space-y-6" onsubmit="handleEmailSubmit(event)">
                        <div>
                            <label for="email" class="sr-only">Email address</label>
                            <input id="email" name="email" type="email" autocomplete="email" required class="pro-input relative block w-full px-3 py-3" placeholder="Email address">
                        </div>
                        <!-- Captcha Section -->
                        <div id="captcha-section" class="space-y-3 p-4 border border-[var(--border-color)] rounded-lg bg-dark-bg">
                            <p id="captcha-prompt" class="text-center text-sm font-medium text-text-secondary">Loading security challenge...</p>
                            <div class="flex items-center justify-around h-32">
                                <div id="captcha-hand" class="text-slate-400">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-14 w-14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 11.5V14m0-2.5v-6a1.5 1.5 0 113 0m-3 6a1.5 1.5 0 00-3 0v2a7.5 7.5 0 0015 0v-5a1.5 1.5 0 00-3 0m-6-3V11m0-5.5v-1a1.5 1.5 0 013 0v1m0 0V11m0-5.5a1.5 1.5 0 013 0v3m0 0V11" /></svg>
                                </div>
                                <div id="captcha-animal" class="text-blue-500">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-14 w-14" viewBox="0 0 24 24" fill="currentColor">
                                        <g transform="rotate(-90 12 12)">
                                            <path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" />
                                        </g>
                                    </svg>
                                </div>
                            </div>
                            <div class="flex items-center justify-center space-x-4">
                                <button type="button" onclick="rotateAnimal(-45)" class="p-3 bg-gray-700 rounded-full hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                                </button>
                                 <button type="button" onclick="rotateAnimal(45)" class="p-3 bg-gray-700 rounded-full hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                                </button>
                            </div>
                            <input type="hidden" id="captcha-rotation" name="captcha_rotation">
                        </div>
                        <button id="email-submit-btn" type="submit" class="pro-btn group relative flex w-full justify-center py-3 px-4 text-sm uppercase">Continue</button>
                    </form>
                </div>

                <div id="totp-form" class="hidden fade-in">
                    <form class="space-y-6" onsubmit="handleTotpSubmit(event)">
                        <div>
                            <label for="totp" class="sr-only">Authenticator Code</label>
                            <input id="totp" name="totp" type="text" inputmode="numeric" pattern="[0-9]{6}" required class="pro-input relative block w-full px-3 py-3 text-center text-lg tracking-widest" placeholder="6-digit code">
                        </div>
                        <button id="totp-submit-btn" type="submit" class="pro-btn group relative flex w-full justify-center py-3 px-4 text-sm uppercase">Verify Code</button>
                    </form>
                </div>

                <div id="login-options" class="hidden fade-in space-y-4">
                     <a href="{{ url_for('login_google') }}" class="pro-btn pro-btn-secondary group relative flex w-full justify-center items-center py-3 px-4 text-sm uppercase">
                        <img class="h-5 w-5 mr-3" src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google icon"> Sign in with Google
                    </a>
                    <button onclick="sendMagicLink()" id="magic-link-btn" class="pro-btn pro-btn-secondary group relative flex w-full justify-center py-3 px-4 text-sm uppercase">Send Magic Link</button>
                </div>
            </div>
        </main>
    </div>
    <script>
        const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
        const apiHeaders = { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken };

        const emailForm = document.getElementById('email-form');
        const totpForm = document.getElementById('totp-form');
        const loginOptions = document.getElementById('login-options');
        const formTitle = document.getElementById('form-title');
        const formSubtitle = document.getElementById('form-subtitle');
        const errorDiv = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        
        const captchaPrompt = document.getElementById('captcha-prompt');
        const captchaHand = document.getElementById('captcha-hand');
        const captchaAnimal = document.getElementById('captcha-animal');
        const captchaRotationInput = document.getElementById('captcha-rotation');
        let currentRotation = 0;

        function showLoading(btn) { btn.disabled = true; btn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`; }
        function hideLoading(btn, originalText) { btn.disabled = false; btn.innerHTML = originalText; }
        function showError(message, isHtml = false) {
            if (isHtml) { errorText.innerHTML = message; } else { errorText.textContent = message; }
            errorDiv.classList.remove('hidden');
        }
        function hideMessages() { errorDiv.classList.add('hidden'); }

        async function loadCaptcha() {
            try {
                const response = await fetch('/api/rotation-captcha');
                const data = await response.json();
                
                captchaPrompt.textContent = data.prompt;
                captchaHand.style.transform = `rotate(${data.target_rotation}deg)`;
                
                currentRotation = data.initial_rotation;
                captchaAnimal.style.transform = `rotate(${currentRotation}deg)`;
                captchaRotationInput.value = currentRotation;

            } catch (err) {
                captchaPrompt.textContent = 'Could not load challenge. Please refresh.';
            }
        }

        function rotateAnimal(degrees) {
            currentRotation = (currentRotation + degrees + 360) % 360;
            captchaAnimal.style.transform = `rotate(${currentRotation}deg)`;
            captchaRotationInput.value = currentRotation;
        }

        async function handleEmailSubmit(event) {
            event.preventDefault();
            hideMessages();

            const btn = document.getElementById('email-submit-btn');
            const originalBtnText = btn.innerHTML;
            showLoading(btn);
            
            const payload = {
                email: document.getElementById('email').value,
                captcha_rotation: captchaRotationInput.value
            };

            const response = await fetch('/api/login/email', { method: 'POST', headers: apiHeaders, body: JSON.stringify(payload) });
            const data = await response.json();
            hideLoading(btn, originalBtnText);
            
            if (data.success) {
                emailForm.classList.add('hidden');
                if (data.action === 'setup_2fa') { window.location.href = '/setup-2fa'; } 
                else if (data.action === 'enter_totp') {
                    formTitle.textContent = 'Multi-Factor Authentication';
                    formSubtitle.textContent = 'Enter the code from your authenticator app.';
                    totpForm.classList.remove('hidden');
                }
            } else {
                if (data.reason === 'captcha_failed') {
                    showError(data.error);
                    loadCaptcha();
                } else if (data.reason === 'not_found') {
                    const requestAccessUrl = "{{ url_for('request_access_page') }}";
                    const errorMessageHtml = `Account not found. <a href="${requestAccessUrl}" class="font-bold underline hover:text-blue-300">Click here to request access.</a>`;
                    showError(errorMessageHtml, true);
                } else {
                    showError(data.error || data.message || 'An unknown error occurred.');
                }
            }
        }
        async function handleTotpSubmit(event) {
            event.preventDefault();
            hideMessages();
            const btn = document.getElementById('totp-submit-btn');
            const originalBtnText = btn.innerHTML;
            showLoading(btn);
            const otp = document.getElementById('totp').value;
            const response = await fetch('/api/login/totp', { method: 'POST', headers: apiHeaders, body: JSON.stringify({ otp: otp }) });
            const data = await response.json();
            hideLoading(btn, originalBtnText);
            if (data.success) {
                formTitle.textContent = 'Choose Login Method';
                formSubtitle.textContent = 'You are one step away from accessing your account.';
                totpForm.classList.add('hidden');
                loginOptions.classList.remove('hidden');
            } else { showError(data.error || 'Verification failed.'); }
        }
        async function sendMagicLink() {
            hideMessages();
            const btn = document.getElementById('magic-link-btn');
            const originalBtnText = btn.innerHTML;
            showLoading(btn);
            const response = await fetch('/api/send-magic-link', { method: 'POST', headers: apiHeaders });
            const data = await response.json();
            hideLoading(btn, originalBtnText);
            if (data.success) { 
                document.getElementById('success-message').classList.remove('hidden');
                document.getElementById('success-message').textContent = data.message;
                btn.disabled = true; 
            } else { showError(data.error || 'Could not send link.'); }
        }

        document.addEventListener('DOMContentLoaded', loadCaptcha);
    </script>
</body>
</html>
