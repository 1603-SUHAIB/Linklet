{% extends "layout.html" %}
{% block title %}Verify OTP{% endblock %}
{% block content %}
<div class="auth-icon">🛡️</div>
<h1>Two-Factor Authentication</h1>
<p>For your security, please enter the 6-digit code sent to <strong style="color: var(--text-primary);">{{ email }}</strong>.</p>

{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}

<form method="post">
    <div class="form-group">
        <label for="otp">One-Time Password</label>
        <input type="text" id="otp" name="otp" class="form-input" required pattern="\d{6}" maxlength="6" title="Enter 6-digit OTP" inputmode="numeric" autofocus />
    </div>
    <button type="submit" class="btn">Verify Code</button>
</form>
{% endblock %}
